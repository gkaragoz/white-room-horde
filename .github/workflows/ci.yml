name: ci
# Fast gate on every push and pull request (about 5 minutes). The slow cross-browser / full-game QA lives in qa-full.yml.
on:
  push:
    branches: [main, master]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The in-browser QA page and a real game page in Chromium only (the other engines run in qa-full).
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wrh/client build
      - run: pnpm exec playwright install --with-deps chromium
      - run: node tools/ci/check-dist.mjs
      - run: node tools/ci/qa-browsers.mjs chromium
      - run: node tools/ci/game-smoke.mjs chromium
      - run: node tools/ci/dev-boot.mjs
