name: ci
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # The in-browser QA page in real browsers: every test in Chromium, and the cross-engine determinism check
  # (same simulation hashes as Node) in Firefox and WebKit.
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @wrh/client build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: node tools/ci/check-dist.mjs
      - run: node tools/ci/qa-browsers.mjs chromium firefox webkit
      - run: node tools/ci/game-smoke.mjs chromium
      - run: node tools/ci/game-smoke.mjs firefox
      - run: node tools/ci/game-smoke.mjs webkit
      # the whole game in a real page: every class, aiming, the release notes window, and the online movement check
      # (the last one only prints its numbers on a runner without a GPU; see tools/ci/net-stutter.mjs)
      - run: node tools/ci/play-all.mjs
      - run: node tools/ci/aim-check.mjs
      - run: node tools/ci/notes-check.mjs
      - run: node tools/ci/menu-shots.mjs
      - run: node tools/ci/drone-shots.mjs
      - run: node tools/ci/net-stutter.mjs
        continue-on-error: true
